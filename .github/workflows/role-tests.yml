name: Role tests
on:
  push:
  pull_request:
permissions: {}
jobs:
  test:
    name: ansible-core ${{ matrix.ansible-core }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ansible-core:
          - '2.19'
          - '2.21'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - name: Install ansible-core
        run: python -m pip install "ansible-core~=${ANSIBLE_CORE_VERSION}.0"
        env:
          ANSIBLE_CORE_VERSION: ${{ matrix.ansible-core }}
      - name: Run tests
        run: tests/run.sh
  # The test job skips test_tmpclean_real.yml, as those runners don't have the tools. These two jobs install
  # them and run it against the real tmpreaper (Debian) and tmpwatch (RedHat).
  tmpreaper:
    name: tmpclean with the real tmpreaper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - name: Install ansible-core
        run: python -m pip install "ansible-core~=2.21.0"
      - name: Install tmpreaper
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tmpreaper
      # Without the tool the test skips, so check it is where the role expects it.
      - name: Check tmpreaper is installed
        run: test -x /usr/sbin/tmpreaper
      - name: Run test
        run: tests/run.sh test_tmpclean_real.yml
  tmpwatch:
    name: tmpclean with the real tmpwatch
    # Ubuntu has no tmpwatch package, so use an EL container, where it is in AppStream.
    runs-on: ubuntu-latest
    container: rockylinux:9
    steps:
      - name: Install tmpwatch and Python
        run: dnf install -y tmpwatch tar git python3.12 python3.12-pip
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install ansible-core
        run: python3.12 -m pip install "ansible-core~=2.21.0"
      - name: Check tmpwatch is installed
        run: test -x /usr/bin/tmpwatch
      - name: Run test
        run: tests/run.sh test_tmpclean_real.yml
