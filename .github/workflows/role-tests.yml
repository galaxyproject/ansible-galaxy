name: Role tests
on:
  push:
  pull_request:
permissions: {}
jobs:
  test:
    name: ansible-core ${{ matrix.ansible-core }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ansible-core:
          - '2.19.14'
          - '2.21.5'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - name: Install ansible-core
        run: python -m pip install "ansible-core==${ANSIBLE_CORE_VERSION}"
        env:
          ANSIBLE_CORE_VERSION: ${{ matrix.ansible-core }}
      - name: Run tests
        run: tests/run.sh
