name: Ansible lint
on:
  push:
  pull_request:
permissions: {}
jobs:
  lint:
    name: Lint files that pass ansible-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - name: Install ansible-lint
        run: python -m pip install ansible-lint==26.10.1
      # Add a file here once it passes ansible-lint, so it stays clean. Keep the list sorted.
      - name: Lint
        run: >-
          ansible-lint
          defaults/main.yml
          handlers/main.yml
          tasks/_inc_client_check_prebuilt.yml
          tasks/_inc_client_prebuilt.yml
          tasks/_inc_client_prebuilt_needs_stage.yml
          tasks/_inc_galaxy_version.yml
          tasks/clean_virtualenv.yml
          tasks/cleanup.yml
          tasks/database.yml
          tasks/layout.yml
          tasks/local_tools.yml
          tasks/static_setup.yml
          tasks/user-facts.yml
          tests/fake_galaxyctl.yml
          tests/files/include_database.yml
          tests/test_cleanup.yml
          tests/test_database.yml
          tests/test_handlers.yml
          tests/test_layout.yml
          tests/test_local_tools.yml
          tests/test_prebuilt_client.yml
          tests/test_systemd_unit.yml
          tests/test_tmpclean_command.yml
          tests/test_tmpclean_real.yml
          tests/test_user_facts.yml
