---
# Fail unless the staged prebuilt client is in static/dist (#235).
# Galaxy's stage script always copies the client's top-level dist files to static/dist in galaxy_server_dir, whatever
# galaxy_static_dir is. Any file there passes, so on an existing install a client from an earlier release also passes.
- name: Find the staged prebuilt client
  ansible.builtin.find:
    paths: "{{ galaxy_server_dir }}/static/dist"
    file_type: file
  register: __galaxy_prebuilt_client_files

- name: Ensure the prebuilt client is in static/dist
  ansible.builtin.assert:
    that:
      - __galaxy_prebuilt_client_files.files | length > 0
    success_msg: "Prebuilt client is in {{ galaxy_server_dir }}/static/dist"
    fail_msg: >-
      The prebuilt client is not installed: {{ galaxy_server_dir }}/static/dist has no files.
      The client install may have failed, or the client package may not be published
      for Galaxy version {{ __galaxy_major_version | default('(unknown)') }}.
