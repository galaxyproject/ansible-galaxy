---
# Regression tests for the Gravity handlers in handlers/main.yml.
# The role's handlers are loaded without running its tasks, and galaxyctl is replaced by a fake that logs each call.
# `import_role` is static, so it registers the role's handlers at parse time. Its tasks_from is user-facts.yml,
# the one task file with no side effects (it only sets the user's group facts), so no other role task runs.
# (`when: false` doesn't work: it skips the handlers too.)
- name: Test the 23.0+ Gravity handlers
  hosts: localhost
  gather_facts: false
  # The handlers run as the current user, and setting galaxy_group keeps user-facts.yml from needing getent.
  vars: &handler_test_vars
    galaxy_systemd_mode: gravity
    __galaxy_major_version: "23.0"
    galaxy_config_file: /srv/galaxy/config/galaxy.yml
    galaxy_gravity_state_dir: /srv/galaxy/custom gravity
    galaxy_gravity_restart_action: graceful
    galaxy_gravity_graceful_start_if_stopped: false
    galaxy_manage_systemd: false
    galaxy_systemd_root: false
    __galaxy_gravity_pm: supervisor
    galaxy_user: "{{ lookup('ansible.builtin.pipe', 'id -un') }}"
    galaxy_group: "{{ lookup('ansible.builtin.pipe', 'id -gn') }}"
    __galaxy_user_name: "{{ galaxy_user }}"
  tasks:
    - name: Load the role's handlers and run only user-facts.yml
      ansible.builtin.import_role:
        name: galaxyproject.galaxy
        tasks_from: user-facts

    - name: Set up the fake galaxyctl
      ansible.builtin.include_tasks: fake_galaxyctl.yml

    - name: Notify the handlers by their listen topics
      ansible.builtin.debug:
        msg: Notifying
      changed_when: true
      notify:
        - restart galaxy
        - galaxyctl update

    - name: Run the handlers
      ansible.builtin.meta: flush_handlers

    - name: Read the log
      ansible.builtin.slurp:
        src: "{{ fake_log }}"
      register: calls

    - name: Check galaxyctl was called to update and then to restart
      ansible.builtin.assert:
        that:
          - (calls.content | b64decode).splitlines() | length == 2
          - (calls.content | b64decode).splitlines()[0] is search('argv=-c ' ~ galaxy_config_file ~ ' update\|')
          - (calls.content | b64decode).splitlines()[1] is search('argv=-c ' ~ galaxy_config_file ~ ' graceful\|')
          - (calls.content | b64decode).splitlines() | select('search', 'bytecode=1\|') | list | length == 2
          - (calls.content | b64decode).splitlines() | select('search', 'state=' ~ galaxy_gravity_state_dir ~ '\|') | list | length == 2
          - (calls.content | b64decode).splitlines() | select('search', 'user=' ~ __galaxy_user_name ~ '$') | list | length == 2

    - name: Remove the temp dir
      ansible.builtin.file:
        path: "{{ fake_dir }}"
        state: absent

# Playbooks may notify handlers by name, so renaming a handler must keep its old name working.
- name: Test that the 23.0+ Gravity handlers can be notified by their old names
  hosts: localhost
  gather_facts: false
  vars: *handler_test_vars
  tasks:
    - name: Load the role's handlers and run only user-facts.yml
      ansible.builtin.import_role:
        name: galaxyproject.galaxy
        tasks_from: user-facts

    - name: Set up the fake galaxyctl
      ansible.builtin.include_tasks: fake_galaxyctl.yml

    - name: Notify the handlers by their old names
      ansible.builtin.debug:
        msg: Notifying
      changed_when: true
      notify:
        - galaxyctl update (23.0+)
        - galaxy gravity restart (23.0+)

    - name: Run the handlers
      ansible.builtin.meta: flush_handlers

    - name: Read the log
      ansible.builtin.slurp:
        src: "{{ fake_log }}"
      register: calls

    - name: Check both handlers ran
      ansible.builtin.assert:
        that:
          - (calls.content | b64decode).splitlines() | length == 2
          - (calls.content | b64decode).splitlines()[0] is search('argv=-c ' ~ galaxy_config_file ~ ' update\|')
          - (calls.content | b64decode).splitlines()[1] is search('argv=-c ' ~ galaxy_config_file ~ ' graceful\|')
          - (calls.content | b64decode).splitlines() | select('search', 'state=' ~ galaxy_gravity_state_dir ~ '\|') | list | length == 2

    - name: Remove the temp dir
      ansible.builtin.file:
        path: "{{ fake_dir }}"
        state: absent

# Handler names are global to a play: a notify by name runs only the last handler loaded with that name, so a generic
# name (e.g. "Reload systemd daemon") could replace another role's handler, or be replaced by it.
- name: Test that every handler name is specific to Galaxy
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Check each handler name mentions Galaxy or Gravity
      ansible.builtin.assert:
        that:
          - item is search('Galaxy|Gravity')
        fail_msg: "Handler name '{{ item }}' isn't specific to this role. Name it after Galaxy or Gravity."
        quiet: true
      loop: "{{ lookup('ansible.builtin.file', playbook_dir | dirname ~ '/handlers/main.yml') | from_yaml | map(attribute='name') }}"

# galaxy_manage_restart: false leaves restarting to the playbook, e.g. its own handler listening on `restart galaxy`.
# The role's handlers are skipped, but the playbook's handler still runs.
- name: Test galaxy_manage_restart false skips the 23.0+ Gravity handlers
  hosts: localhost
  gather_facts: false
  vars: *handler_test_vars
  tasks:
    - name: Set the variables this test changes
      ansible.builtin.set_fact:
        galaxy_manage_restart: false

    - name: Load the role's handlers and run only user-facts.yml
      ansible.builtin.import_role:
        name: galaxyproject.galaxy
        tasks_from: user-facts

    - name: Set up the fake galaxyctl
      ansible.builtin.include_tasks: fake_galaxyctl.yml

    - name: Notify the handlers
      ansible.builtin.debug:
        msg: Notifying
      changed_when: true
      notify:
        - restart galaxy
        - galaxyctl update

    - name: Run the handlers
      ansible.builtin.meta: flush_handlers

    - name: Read the log
      ansible.builtin.slurp:
        src: "{{ fake_log }}"
      register: calls

    - name: Check only the playbook's own handler ran
      ansible.builtin.assert:
        that:
          - (calls.content | b64decode).splitlines() == ['own handler']

    - name: Remove the temp dir
      ansible.builtin.file:
        path: "{{ fake_dir }}"
        state: absent

  handlers:
    - name: Restart Galaxy in the playbook
      ansible.builtin.shell: echo 'own handler' >> "{{ fake_log }}"
      changed_when: true
      listen: restart galaxy

# A string such as "false" (from `-e galaxy_manage_restart=false` or an INI inventory) is truthy in a bare Jinja `and`,
# so the handlers have to convert it with `| bool`.
- name: Test galaxy_manage_restart given as the string false skips the handlers
  hosts: localhost
  gather_facts: false
  vars: *handler_test_vars
  tasks:
    - name: Set the variables this test changes
      ansible.builtin.set_fact:
        galaxy_manage_restart: "false"

    - name: Load the role's handlers and run only user-facts.yml
      ansible.builtin.import_role:
        name: galaxyproject.galaxy
        tasks_from: user-facts

    - name: Set up the fake galaxyctl
      ansible.builtin.include_tasks: fake_galaxyctl.yml

    - name: Notify the handlers
      ansible.builtin.debug:
        msg: Notifying
      changed_when: true
      notify:
        - restart galaxy
        - galaxyctl update

    - name: Run the handlers
      ansible.builtin.meta: flush_handlers

    - name: Read the log
      ansible.builtin.slurp:
        src: "{{ fake_log }}"
      register: calls

    - name: Check galaxyctl wasn't called
      ansible.builtin.assert:
        that:
          - (calls.content | b64decode).splitlines() | length == 0

    - name: Remove the temp dir
      ansible.builtin.file:
        path: "{{ fake_dir }}"
        state: absent

# The 22.05 handlers only run with galaxy_manage_systemd, so turn that on to check they are skipped too.
- name: Test galaxy_manage_restart false skips the 22.05 Gravity handlers
  hosts: localhost
  gather_facts: false
  vars: *handler_test_vars
  tasks:
    - name: Set the variables this test changes
      ansible.builtin.set_fact:
        galaxy_manage_restart: false
        galaxy_manage_systemd: true
        __galaxy_major_version: "22.05"

    - name: Load the role's handlers and run only user-facts.yml
      ansible.builtin.import_role:
        name: galaxyproject.galaxy
        tasks_from: user-facts

    - name: Set up the fake galaxyctl
      ansible.builtin.include_tasks: fake_galaxyctl.yml

    - name: Notify the handlers
      ansible.builtin.debug:
        msg: Notifying
      changed_when: true
      notify:
        - restart galaxy
        - galaxyctl update

    - name: Run the handlers
      ansible.builtin.meta: flush_handlers

    - name: Read the log
      ansible.builtin.slurp:
        src: "{{ fake_log }}"
      register: calls

    - name: Check galaxyctl wasn't called
      ansible.builtin.assert:
        that:
          - (calls.content | b64decode).splitlines() | length == 0

    - name: Remove the temp dir
      ansible.builtin.file:
        path: "{{ fake_dir }}"
        state: absent

# Running the start, restart and reload handlers would need systemd, so check the handlers file instead: every handler
# except the daemon reload is gated on galaxy_manage_restart, and the reload (not a restart) isn't.
- name: Test which handlers galaxy_manage_restart gates
  hosts: localhost
  gather_facts: false
  vars:
    handler_list: "{{ lookup('ansible.builtin.file', playbook_dir | dirname ~ '/handlers/main.yml') | from_yaml }}"
    version_handler: Ensure Galaxy version is set for the handlers
  tasks:
    # The other handlers' conditions read the version, so this one must only set it, and run before them.
    - name: Check the version handler only sets the version and comes first
      ansible.builtin.assert:
        that:
          - (handler_list | selectattr('name', 'equalto', version_handler) | list | length) == 1
          - (handler_list | first).name == version_handler
          - (handler_list | first)['ansible.builtin.include_tasks'] == '_inc_galaxy_version.yml'

    - name: Check the reload handler is not gated
      ansible.builtin.assert:
        that:
          - (handler_list | selectattr('name', 'equalto', 'Reload systemd daemon for Galaxy') | list | length) == 1
          - handler_list | selectattr('name', 'equalto', 'Reload systemd daemon for Galaxy') | selectattr('when', 'defined') | list | length == 0

    - name: Check every other handler is gated
      ansible.builtin.assert:
        that:
          - item.when is search('^galaxy_manage_restart \| bool and ')
        fail_msg: "Handler '{{ item.name }}' isn't gated on galaxy_manage_restart."
        quiet: true
      loop: "{{ handler_list | rejectattr('name', 'equalto', 'Reload systemd daemon for Galaxy') | list }}"
      loop_control:
        label: "{{ item.name }}"
