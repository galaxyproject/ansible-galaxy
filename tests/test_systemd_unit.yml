---
# templates/systemd/galaxy.service.j2 and galaxy-reports.service.j2 render the Galaxy and Reports systemd units. They
# must render without galaxy_root, which only the root-dir layout defines, and set HOME only when it is defined.
# Regression test for #138: the unit failed to render on layouts other than root-dir. Also tests that
# galaxy_systemd_extra_directives (#145) lands in the Galaxy unit's [Service] section.
- name: Test the Galaxy systemd unit
  hosts: localhost
  gather_facts: false
  vars:
    galaxy_systemd_root: true
    galaxy_systemd_mode: gravity
    galaxy_systemd_timeout_start_sec: 300
    galaxy_systemd_command: /srv/galaxy/venv/bin/galaxyctl start
    galaxy_systemd_env: []
    galaxy_systemd_extra_directives: []
    __galaxy_user_name: galaxy
    __galaxy_user_group: galaxy
    galaxy_server_dir: /srv/galaxy/server
    galaxy_venv_dir: /srv/galaxy/venv
    galaxy_dynamic_job_rules_dir: /srv/galaxy/dynamic_rules
    galaxy_gravity_state_dir: /srv/galaxy/var/gravity
    galaxy_config_file: /srv/galaxy/config/galaxy.yml
    galaxy_config_style: yaml
    galaxy_reports_path: /srv/galaxy/config/reports.yml
    __galaxy_systemd_memory_limit_merged:
      mule: 8
      reports: 1
  tasks:
    - name: Create a temporary directory
      ansible.builtin.tempfile:
        state: directory
      register: __unit_dir

    - name: Render the units without galaxy_root
      ansible.builtin.template:
        src: "{{ playbook_dir | dirname }}/templates/systemd/{{ item }}.service.j2"
        dest: "{{ __unit_dir.path }}/{{ item }}-no-root.service"
        mode: "0644"
      loop: &units
        - galaxy
        - galaxy-reports

    - name: Render the units with galaxy_root
      ansible.builtin.template:
        src: "{{ playbook_dir | dirname }}/templates/systemd/{{ item }}.service.j2"
        dest: "{{ __unit_dir.path }}/{{ item }}-with-root.service"
        mode: "0644"
      loop: *units
      vars:
        galaxy_root: /srv/galaxy

    - name: Check HOME is set only when galaxy_root is defined
      ansible.builtin.assert:
        that:
          - "'HOME=' not in lookup('ansible.builtin.file', __unit_dir.path ~ '/' ~ item ~ '-no-root.service')"
          - "'Environment=HOME=/srv/galaxy\n' in lookup('ansible.builtin.file', __unit_dir.path ~ '/' ~ item ~ '-with-root.service', rstrip=false)"
      loop: *units

    - name: Render the Galaxy unit with extra directives
      ansible.builtin.template:
        src: "{{ playbook_dir | dirname }}/templates/systemd/galaxy.service.j2"
        dest: "{{ __unit_dir.path }}/galaxy-extra-directives.service"
        mode: "0644"
      vars:
        galaxy_systemd_extra_directives:
          - ProtectSystem=yes
          - NoNewPrivileges=yes

    # systemd uses the last value of a setting, so the directives must be the last lines of the Service section to
    # override the role's own (e.g. Restart=).
    - name: Check the extra directives end the Service section
      ansible.builtin.assert:
        that:
          - __service_section.endswith('\n\nProtectSystem=yes\nNoNewPrivileges=yes\n\n')
          - "'ProtectSystem' not in __unit_text.split('[Service]')[0]"
          - "'ProtectSystem' not in __unit_text.split('[Install]')[1]"
      vars:
        __unit_text: "{{ lookup('ansible.builtin.file', __unit_dir.path ~ '/galaxy-extra-directives.service', rstrip=false) }}"
        __service_section: "{{ __unit_text.split('[Service]')[1].split('[Install]')[0] }}"

    # Both renders use the same vars apart from the directives, so this checks the directives are written once and
    # nothing else in the unit depends on the list (not that the default unit is unchanged; the next task does that).
    - name: Check the directive lines and their blank line are the only difference from the unit without them
      ansible.builtin.assert:
        that:
          - __with_directives | replace('ProtectSystem=yes\nNoNewPrivileges=yes\n\n', '', 1) == __without_directives
      vars:
        __with_directives: "{{ lookup('ansible.builtin.file', __unit_dir.path ~ '/galaxy-extra-directives.service', rstrip=false) }}"
        __without_directives: "{{ lookup('ansible.builtin.file', __unit_dir.path ~ '/galaxy-no-root.service', rstrip=false) }}"

    # With no directives the loop renders nothing, not even a blank line: the last setting before it (an *IOAccounting=
    # line) is followed by one blank line and the next section.
    - name: Check the default unit has nothing between the last setting and the Install section
      ansible.builtin.assert:
        that:
          - (__without_directives.split('[Install]')[0]).endswith('IOAccounting=yes\n\n')
      vars:
        __without_directives: "{{ lookup('ansible.builtin.file', __unit_dir.path ~ '/galaxy-no-root.service', rstrip=false) }}"

    # The plays above set galaxy_systemd_extra_directives themselves, so check the role's own default adds nothing.
    - name: Check the role adds no extra directives by default
      ansible.builtin.assert:
        that:
          - (lookup('ansible.builtin.file', playbook_dir | dirname ~ '/defaults/main.yml') | from_yaml).galaxy_systemd_extra_directives == []

    - name: Remove the temporary directory
      ansible.builtin.file:
        path: "{{ __unit_dir.path }}"
        state: absent
