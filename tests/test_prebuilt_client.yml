---
# tasks/_inc_client_check_prebuilt.yml must fail when the prebuilt client isn't in static/dist.
# Regression test for #235. The yarn install and staging tasks need community.general and node,
# so the test runs only the stage decision before them and the check that follows them.
- name: Test the prebuilt client check
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Make a fake Galaxy server directory
      ansible.builtin.tempfile:
        state: directory
        prefix: galaxy-server-
      register: __server

    - name: Test the check
      vars:
        galaxy_server_dir: "{{ __server.path }}"
        # Galaxy's stage script writes to static/dist in galaxy_server_dir whatever galaxy_static_dir is, so the check
        # must not look in galaxy_static_dir. Give it a populated dist that the check has to ignore.
        galaxy_static_dir: "{{ __server.path }}/elsewhere"
      block:
        - name: Create an empty static/dist and a populated galaxy_static_dir/dist
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            mode: "0755"
          loop:
            - "{{ galaxy_server_dir }}/static/dist"
            - "{{ galaxy_static_dir }}/dist"

        - name: Add a file to galaxy_static_dir/dist
          ansible.builtin.copy:
            content: "console.log('elsewhere');\n"
            dest: "{{ galaxy_static_dir }}/dist/analysis.bundled.js"
            mode: "0644"

        - name: Stage when the install changed nothing but static/dist is empty
          ansible.builtin.include_role:
            name: galaxyproject.galaxy
            tasks_from: _inc_client_prebuilt_needs_stage
          vars:
            __galaxy_prebuilt_client_install_changed: false

        - name: Check staging is needed
          ansible.builtin.assert:
            that:
              - __galaxy_prebuilt_client_needs_stage | bool

        - name: Run the check on an empty static/dist
          block:
            - name: Include the check
              ansible.builtin.include_role:
                name: galaxyproject.galaxy
                tasks_from: _inc_client_check_prebuilt
            - name: Fail if the check passed
              ansible.builtin.fail:
                msg: The check passed on an empty static/dist
          rescue:
            - name: Check the failure names the directory
              ansible.builtin.assert:
                that:
                  - ansible_failed_result.msg is search(galaxy_server_dir ~ '/static/dist')
                  - ansible_failed_result.msg is search('install')

        - name: Run the check when static/dist is missing
          block:
            - name: Remove static/dist
              ansible.builtin.file:
                path: "{{ galaxy_server_dir }}/static/dist"
                state: absent
            - name: Include the check
              ansible.builtin.include_role:
                name: galaxyproject.galaxy
                tasks_from: _inc_client_check_prebuilt
            - name: Fail if the check passed
              ansible.builtin.fail:
                msg: The check passed with no static/dist
          rescue:
            - name: Check the failure names the directory
              ansible.builtin.assert:
                that:
                  - ansible_failed_result.msg is search(galaxy_server_dir ~ '/static/dist')

        # Staging copies the client's files to the top level of static/dist, so a file only in a subdirectory
        # (e.g. left over from something else) doesn't count.
        - name: Run the check with a file only in a subdirectory of static/dist
          block:
            - name: Create static/dist/sub
              ansible.builtin.file:
                path: "{{ galaxy_server_dir }}/static/dist/sub"
                state: directory
                mode: "0755"
            - name: Add a file to static/dist/sub
              ansible.builtin.copy:
                content: "console.log('nested');\n"
                dest: "{{ galaxy_server_dir }}/static/dist/sub/analysis.bundled.js"
                mode: "0644"
            - name: Include the check
              ansible.builtin.include_role:
                name: galaxyproject.galaxy
                tasks_from: _inc_client_check_prebuilt
            - name: Fail if the check passed
              ansible.builtin.fail:
                msg: The check passed with a file only in a subdirectory of static/dist
          rescue:
            - name: Check the failure names the directory
              ansible.builtin.assert:
                that:
                  - ansible_failed_result.msg is search(galaxy_server_dir ~ '/static/dist')
          always:
            - name: Remove static/dist/sub
              ansible.builtin.file:
                path: "{{ galaxy_server_dir }}/static/dist/sub"
                state: absent

        - name: Create static/dist
          ansible.builtin.file:
            path: "{{ galaxy_server_dir }}/static/dist"
            state: directory
            mode: "0755"

        - name: Add a file
          ansible.builtin.copy:
            content: "console.log('client');\n"
            dest: "{{ galaxy_server_dir }}/static/dist/analysis.bundled.js"
            mode: "0644"

        - name: Run the check on a populated static/dist
          ansible.builtin.include_role:
            name: galaxyproject.galaxy
            tasks_from: _inc_client_check_prebuilt

        - name: Don't stage when the install changed nothing and static/dist has files
          ansible.builtin.include_role:
            name: galaxyproject.galaxy
            tasks_from: _inc_client_prebuilt_needs_stage
          vars:
            __galaxy_prebuilt_client_install_changed: false

        - name: Check staging isn't needed
          ansible.builtin.assert:
            that:
              - not (__galaxy_prebuilt_client_needs_stage | bool)

        - name: Stage when the install changed something, even if static/dist has files
          ansible.builtin.include_role:
            name: galaxyproject.galaxy
            tasks_from: _inc_client_prebuilt_needs_stage
          vars:
            __galaxy_prebuilt_client_install_changed: true

        - name: Check staging is needed after an install change
          ansible.builtin.assert:
            that:
              - __galaxy_prebuilt_client_needs_stage | bool

      always:
        - name: Remove the fake server directory
          ansible.builtin.file:
            path: "{{ __server.path }}"
            state: absent
